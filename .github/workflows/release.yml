name: Release

# Pushing a `vX.Y.Z` tag builds every target, publishes a GitHub release and signs it
# with a packslip bundle. Running it by hand only builds the archives, as a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          set -euo pipefail
          name="mrq-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/mrq" README.md "dist/$name/"
          "dist/$name/mrq" --version
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" >"$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrq-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release and upload assets
      id-token: write # Sign the packslip bundle with the workflow identity
      attestations: write # Attest the release archives
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mrq-*
          path: dist
          merge-multiple: true
      # Draft first: packslip records the digest of each final asset, and immutable
      # releases cannot take new assets once published.
      - run: gh release create "$TAG" --draft --verify-tag --generate-notes dist/*
      - uses: jdx/packslip@2af36e792faa28130987c8af509e475c7458405d # v1.6.0
        with:
          artifacts: dist/*.tar.gz
          bin: mrq
          resources: |
            completion/bash,zsh,fish=exec:mrq completion {shell}
      - run: gh release edit "$TAG" --draft=false
