[package]
name = "mrq"
version = "0.1.0"
edition = "2024"
description = "Keyboard-driven TUI for the GitLab merge requests you need to review"
repository = "https://github.com/flou/mrq"
license = "MIT"
rust-version = "1.98"

[profile.release]
lto = true
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Production code has no panics that aren't already annotated with a reason (see the
# per-site #[expect] below); tests use unwrap/expect constantly, so main.rs allows both
# crate-wide under cfg(test).
unwrap_used = "warn"
expect_used = "warn"
redundant_clone = "warn"
explicit_iter_loop = "warn"
format_push_string = "warn"
missing_const_for_fn = "warn"
use_self = "warn"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.11"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
jiff = { version = "0.2.35", features = ["serde"] }
rand = "0.10.2"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "json", "http2", "charset", "system-proxy"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs", "io-util"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"

[dev-dependencies]
jsonschema = { version = "0.56.0", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"
