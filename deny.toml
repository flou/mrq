# cargo-deny configuration. Run with `mise run deny` (also part of `mise run check`).
# Docs: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
# Check the whole feature-unified graph rather than just the default features, so a
# license can't sneak in through a feature that only CI's `clippy --all-features` builds.
all-features = true

[advisories]
# Vulnerabilities and yanked crates fail the check; the advisory database is fetched on
# each run, so a new advisory for an existing dependency breaks the build on purpose.
# Add targeted `ignore` entries here only with a written reason.

[licenses]
# Everything below is permissive and safe to combine with mrq's own MIT license. Copyleft
# licenses (GPL/AGPL/LGPL-only/SSPL) are intentionally absent: cargo-deny denies anything
# not in this list, which is the whole point of the gate.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# License text detection is fuzzy; keep the default threshold and rely on the allow list.

[bans]
# Duplicate versions are common and usually benign, so warn rather than fail. Promote a
# specific crate here only if a duplicate is a real supply-chain concern.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Dependencies must come from crates.io; git and alternate registries are rejected by
# default so a `[patch]` or git dependency has to be added here deliberately.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
